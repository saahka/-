<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0806}
body{display:flex;align-items:center;justify-content:center;font-family:Rubik,'Segoe UI',sans-serif;color:#e6d7b0}
#stage{width:640px;height:360px;position:relative;flex:none;transform-origin:center center}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated}

 background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud button,#hud .card,#dialogue{pointer-events:auto}
.card{width:40px;height:56px;background:#ded5b2;border:1px solid #191510;position:relative;color:#23201a;
 font-family:Rubik;font-weight:700;cursor:pointer;transition:transform .09s ease,box-shadow .09s ease;
 box-shadow:2px 3px 0 rgba(0,0,0,.5)}
.card .b{position:absolute;left:0;right:0;top:13px;text-align:center;font-size:23px;line-height:1}
.card .s{position:absolute;left:3px;top:2px;font-size:10px}
.card .c{position:absolute;right:3px;bottom:2px;font-size:10px;transform:rotate(180deg)}
.card.joker{background:#262630;color:#f2cc4e}
.card.on:hover{transform:translateY(-6px)}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 2px #e8b64c,2px 6px 0 rgba(0,0,0,.5)}
.card.off{filter:grayscale(.75) brightness(.55);cursor:default}
.card.deal{animation:deal .28s ease backwards}
@keyframes deal{from{transform:translateY(30px);opacity:0}}
#hand{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:5px;z-index:6}
#topLeft{position:absolute;left:8px;top:6px}
#roundLbl{font-family:Oswald;font-weight:600;font-size:12px;color:#cbb98a;letter-spacing:1px}
#calledWrap{display:flex;align-items:center;gap:6px;margin-top:3px}
#calledLbl{font-size:10px;color:#e6c069}
#topRight{position:absolute;right:8px;top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#hudBtns{display:flex;gap:4px}
.mini-btn{pointer-events:auto;font-family:Oswald;font-size:10px;letter-spacing:1px;background:#241a10;color:#cbb98a;
 border:1px solid #6e5233;padding:2px 7px;cursor:pointer}
.mini-btn:hover{background:#382816}
#log{width:176px;height:92px;overflow-y:auto;background:rgba(12,8,5,.82);border:1px solid #6e5233;
 padding:4px 5px;font-size:9px;line-height:1.45;color:#b5a888}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:#6e5233}

#hint{position:absolute;left:0;right:0;bottom:80px;text-align:center;font-size:10px;color:#c9b58a;
 text-shadow:1px 1px 0 #000;display:none}
#btnPlay{position:absolute;right:12px;bottom:60px;width:124px;height:36px;font-family:Oswald;font-weight:600;
 font-size:13px;letter-spacing:1px;background:linear-gradient(#574022,#3d2c15);color:#f0dcae;
 border:2px solid #a8834a;cursor:pointer;box-shadow:0 3px 0 #171008}
#btnPlay:hover:not(:disabled){background:linear-gradient(#6b512c,#4a351b);border-color:#e8b64c}
#btnPlay:disabled{opacity:.35;cursor:default}
#btnChallenge{position:absolute;right:12px;bottom:12px;width:124px;height:42px;font-family:Oswald;font-weight:700;
 font-size:16px;letter-spacing:1px;background:linear-gradient(#6e1d15,#47110b);color:#ffb09e;
 border:2px solid #c2402f;cursor:pointer;box-shadow:0 3px 0 #171008}
#btnChallenge:hover:not(:disabled){background:linear-gradient(#8a271b,#57150d);color:#ffd0c0;border-color:#ff7a5e}
#btnChallenge:disabled{opacity:.35;cursor:default}
#dialogue{position:absolute;left:80px;top:182px;width:480px;min-height:100px;background:rgba(20,13,7,.94);
 border:2px solid #a8834a;box-shadow:3px 3px 0 rgba(0,0,0,.5);padding:9px 12px;display:none;cursor:pointer;z-index:8}
#dialogue.show{display:block}
#dlgName{color:#e8b64c;font-family:Oswald;font-weight:600;font-size:13px;letter-spacing:1px;margin-bottom:4px}
#dlgText{color:#e6dcbc;font-size:11.5px;line-height:1.55;min-height:54px}
#dlgHint{position:absolute;right:8px;bottom:4px;color:#a8834a;font-size:11px;animation:blink 1s steps(2) infinite}

.ov{position:absolute;inset:0;z-index:20;pointer-events:none}
.hidden{display:none!important}

#menuPanel::-webkit-scrollbar{width:4px}
#menuPanel::-webkit-scrollbar-thumb{background:#6e5233}
#mTitle{font-family:Oswald;font-weight:700;font-size:23px;color:#f0dcae;letter-spacing:2px;
 text-shadow:2px 2px 0 #140d05;text-align:center;line-height:1.05}
#mSub{font-family:Oswald;font-weight:500;font-size:10px;color:#a8834a;letter-spacing:3px;text-align:center;
 border-bottom:2px solid #6e5233;padding-bottom:6px;margin-bottom:2px}
.mbtn{font-family:Oswald;font-weight:600;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;text-align:left;
 background:linear-gradient(#4a331b,#33220f);color:#e6d7b0;border:2px solid #6e5233;padding:7px 11px;cursor:pointer;
 box-shadow:0 3px 0 #140d05,inset 0 1px 0 rgba(255,255,255,.07)}
.mbtn:hover{border-color:#e8b64c;color:#ffe9b0;transform:translateX(4px)}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #140d05}
#mRules{margin-top:auto;font-size:8.5px;color:#96865e;line-height:1.45;border-top:1px solid #6e5233;padding-top:6px}
.panelC{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;
 background:repeating-linear-gradient(90deg,#33220f 0 33px,#2a1c0c 33px 36px);border:3px solid #6e5233;
 box-shadow:4px 4px 0 rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.4);padding:14px 18px;display:flex;
 flex-direction:column;gap:7px;min-width:280px;max-height:340px;overflow-y:auto;align-items:stretch}
.ptitle{font-family:Oswald;font-weight:700;font-size:17px;letter-spacing:2px;color:#f0dcae;text-align:center;margin-bottom:2px}
#mpCode{font-family:Oswald;font-weight:700;font-size:24px;letter-spacing:6px;color:#e8b64c;text-align:center;
 background:#1a1108;border:1px solid #6e5233;padding:5px 0}
#lobbyList{font-size:12px;color:#cbb98a;line-height:1.7}

#netStatus,#netStatus2{font-size:10px;color:#c07f3a;text-align:center;min-height:13px;max-width:280px}

 background:#1a1108;color:#f0dcae;border:1px solid #6e5233;padding:5px}
#mpInput::placeholder{letter-spacing:1px;color:#6b573a;font-size:11px}
#goTitle{font-family:Oswald;font-weight:700;font-size:20px;color:#f0dcae;letter-spacing:1px;text-align:center}
.mini{font-family:Oswald;font-size:10px;background:#241a10;color:#cbb98a;border:1px solid #6e5233;
 padding:3px 10px;cursor:pointer}

 background:repeating-linear-gradient(90deg,#33220f 0 33px,#2a1c0c 33px 36px);border:3px solid #6e5233;

 display:flex;gap:12px;max-height:340px;overflow-y:auto}
#cLeft{display:flex;flex-direction:column;align-items:center;gap:7px}
#pvCv{border:2px solid #6e5233;background:#171008}
#cOpts{display:flex;flex-direction:column;gap:4px;width:216px}
.crow{display:flex;align-items:center;gap:4px}
.clab{font-family:Oswald;font-size:10px;color:#cbb98a;width:78px;letter-spacing:.5px;flex:none}
.cbtn{font-family:Oswald;font-size:11px;background:#241a10;color:#e8b64c;border:1px solid #6e5233;
 width:20px;height:20px;cursor:pointer;line-height:1;flex:none}
.cbtn:hover{background:#382816}
.cval{flex:1;display:flex;align-items:center;gap:5px;font-size:10px;color:#e6d7b0;min-width:0;overflow:hidden}
.chip{width:14px;height:14px;border:1px solid #141008;box-shadow:0 0 0 1px #6e5233;flex:none}

<script>
'use strict';
/* ==================== УТИЛИТЫ ==================== */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const angLerp=(a,b,k)=>{let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;return a+d*k;};
const plural=(n,one,few,many)=>n%10==1&&n%100!=11?one:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?few:many);
/* любой сбой одного слоя не ломает весь кадр */
function safe(fn,...a){try{fn(...a);}catch(e){console.warn('layer:',e);}}
/* save/restore с гарантией восстановления */
function sc(g,fn){g.save();try{fn();}finally{g.restore();}}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f),g2=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);
  return 'rgb('+r+','+g2+','+b+')';
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}

/* ==================== КАРТЫ ==================== */
const Q=0,K=1,A=2,JKR=3;
const LETTER=['Q','K','A','J'];
const CARD_KEY=['card_queen','card_king','card_ace','card_joker'];
const matches=(c,called)=>c===called||c===JKR;
function buildDeck(){
  const d=[];for(let i=0;i<6;i++)d.push(Q,K,A);d.push(JKR,JKR);
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
    const tmp=d[i];d[i]=d[j];d[j]=tmp;}
  return d;
}

/* ==================== ЛОКАЛИЗАЦИЯ ==================== */
const STR={
  title:{ru:'БАР ЛЖЕЦОВ',en:"LIAR'S BAR"},sub:{ru:'ПОСЛЕДНИЙ ГЛОТОК',en:'THE LAST SIP'},

  charBtn:{ru:'Персонаж',en:'Character'},

  rules2:{ru:'Кого поймали на лжи — револьвер стреляет в него. Последний живой забирает всё.',en:'Get caught lying — the revolver fires. Last one standing takes all.'},
  you:{ru:'Вы',en:'You'},max:{ru:'Макс',en:'Max'},vic:{ru:'Вика',en:'Vic'},scarlett:{ru:'Скарлетт',en:'Scarlett'},
  barman:{ru:'Бармен',en:'Barman'},
  p1:{ru:'Игрок 1',en:'Player 1'},p2:{ru:'Игрок 2',en:'Player 2'},p3:{ru:'Игрок 3',en:'Player 3'},p4:{ru:'Игрок 4',en:'Player 4'},
  card_queen:{ru:'Дама',en:'Queen'},card_king:{ru:'Король',en:'King'},card_ace:{ru:'Туз',en:'Ace'},card_joker:{ru:'Джокер',en:'Joker'},
  calledLbl:{ru:'Заказано:',en:'Called:'},yourLives:{ru:'ВАШИ ЖИЗНИ',en:'YOUR LIVES'},
  put:{ru:'ПОЛОЖИТЬ',en:'PLAY'},challenge:{ru:'НЕ ВЕРЮ!',en:'LIAR!'},
  hint:{ru:'Выберите 1–3 карты → ПОЛОЖИТЬ, либо НЕ ВЕРЮ (клавиши 1–5, Enter, Q)',en:'Select 1–3 cards → PLAY, or LIAR (keys 1–5, Enter, Q)'},
  win:{ru:'Вы выжили. Долг прощён.',en:'You survived. The debt is forgiven.'},
  lose:{ru:'Бар забирает всё.',en:'The bar takes everything.'},
  round:n=>({ru:'РАУНД '+n,en:'ROUND '+n}),
  logRound:(n,ci)=>({ru:'— Раунд '+n+': заказана '+STR[CARD_KEY[ci]].ru+' —',en:'— Round '+n+': '+STR[CARD_KEY[ci]].en+' called —'}),
  logPlayed:(p,n)=>({ru:p+' выкладывает '+n+' '+plural(n,'карту','карты','карт')+' рубашкой вверх.',en:p+' plays '+n+' card'+(n>1?'s':'')+' face down.'}),
  logChallenge:p=>({ru:p+': «Не верю!»',en:p+': "Liar!"'}),
  logTruth:p=>({ru:'Это была правда. '+p+' платит жизнью.',en:'It was the truth. '+p+' pays with a life.'}),
  logLie:p=>({ru:p+' лгал! Жизнь — на стол.',en:p+' was lying! A life on the table.'}),

  mpTitle:{ru:'ИГРА ПО СЕТИ',en:'ONLINE GAME'},mpCreate:{ru:'Создать комнату',en:'Create room'},
  mpJoin:{ru:'Войти по коду',en:'Join by code'},mpBack:{ru:'Назад',en:'Back'},
  mpCode:{ru:'КОД КОМНАТЫ',en:'ROOM CODE'},

  mpCopied:{ru:'Код скопирован!',en:'Code copied!'},
  mpCopy:{ru:'Скопировать код',en:'Copy code'},
  mpStart:{ru:'Начать игру',en:'Start game'},mpPlayers:{ru:'ИГРОКИ',en:'PLAYERS'},
  mpSlotEmpty:{ru:'— пусто (бот) —',en:'— empty (bot) —'},
  mpCodeHint:{ru:'Передайте код друзьям. Пустые места займут боты.',en:'Share the code with friends. Empty seats will be filled by bots.'},
  mpWait:{ru:'ВЫ В КОМНАТЕ',en:'YOU ARE IN'},
  mpWaitT:{ru:'Ждём, пока хост начнёт игру…',en:'Waiting for the host to start…'},
  mpLost:{ru:'Соединение потеряно. Возврат в меню.',en:'Connection lost. Returning to menu.'},
  mpExit:{ru:'Выйти',en:'Leave'},
  again:{ru:'Ещё раз',en:'Again'},toMenu:{ru:'В меню',en:'Menu'},
  /* редактор персонажа */

  charRandom:{ru:'Случайно',en:'Random'},
  charDone:{ru:'Готово',en:'Done'},
  optSkin:{ru:'Кожа',en:'Skin'},optShirt:{ru:'Рубашка',en:'Shirt'},optVest:{ru:'Жилет',en:'Vest'},
  optHat:{ru:'Шляпа',en:'Hat'},optHatColor:{ru:'Цвет шляпы',en:'Hat color'},

};
const t=k=>STR[k][G.lang];
const tf=(k,...a)=>STR[k](...a)[G.lang];

/* ==================== СЮЖЕТ ==================== */
const STORY={
  intro:[

function env(g,tt,a,peak,d){g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(peak,tt+a);
  g.gain.exponentialRampToValueAtTime(.0001,tt+a+d);}
function osc(type,f0,f1,tt,a,d,peak){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,tt);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,tt+a+d);
  env(g,tt,a,peak,d);o.connect(g);g.connect(sfxG);o.start(tt);o.stop(tt+a+d+.05);
}
function noise(tt,a,d,peak,fT,fq,q,dest){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=NB;s.loop=d>1.5;
  const f=AC.createBiquadFilter();f.type=fT;f.frequency.value=fq;f.Q.value=q||1;
  const g=AC.createGain();env(g,tt,a,peak,d);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(tt);s.stop(tt+a+d+.05);
}

function thunder(){
  if(!AC)return;const tt=AC.currentTime;

  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=110;
  const g=AC.createGain();g.gain.setValueAtTime(0,tt);
  g.gain.linearRampToValueAtTime(.5,tt+.15);g.gain.exponentialRampToValueAtTime(.001,tt+2.8);

const JZ={bpm:92,next:0,beat:0,
  bars:[{b:[38,41,45,48],c:[50,53,57,60]},{b:[43,47,50,53],c:[55,59,62,65]},
        {b:[48,52,55,58],c:[48,52,55,59]},{b:[45,48,52,55],c:[57,60,64,67]}]};
const mf=m=>440*Math.pow(2,(m-69)/12);
function startJazz(){
  JZ.next=AC.currentTime+.2;
  setInterval(()=>{
    if(!AC||AC.state!=='running')return;
    const spb=60/JZ.bpm;
    while(JZ.next<AC.currentTime+.6){
      const bar=JZ.bars[Math.floor(JZ.beat/4)%4],beat=JZ.beat%4,tt=JZ.next;
      const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
      o.type='triangle';o.frequency.value=mf(bar.b[beat]);
      f.type='lowpass';f.frequency.value=700;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.5,tt+.02);
      g.gain.exponentialRampToValueAtTime(.001,tt+spb*.9);
      o.connect(f);f.connect(g);g.connect(musG);o.start(tt);o.stop(tt+spb);
      if(beat===1||beat===3)for(let i=1;i<4;i++){
        const o2=AC.createOscillator(),g2=AC.createGain(),f2=AC.createBiquadFilter();
        o2.type='triangle';o2.frequency.value=mf(bar.c[i]);
        f2.type='lowpass';f2.frequency.value=1100;
        g2.gain.setValueAtTime(0,tt);g2.gain.linearRampToValueAtTime(.085,tt+.015);
        g2.gain.exponentialRampToValueAtTime(.001,tt+.3);
        o2.connect(f2);f2.connect(g2);g2.connect(musG);o2.start(tt);o2.stop(tt+.4);}
      hat(tt);hat(tt+spb*.62);
      JZ.beat++;JZ.next+=spb;
    }
  },180);
}
function hat(tt){
  const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
  const g=AC.createGain();g.gain.setValueAtTime(0,tt);
  g.gain.linearRampToValueAtTime(.045,tt+.005);g.gain.exponentialRampToValueAtTime(.001,tt+.06);
  s.connect(f);f.connect(g);g.connect(musG);s.start(tt);s.stop(tt+.1);
}

const AI_CFG={
  cautious:  {ch:.42,trust:.80,bluff:.30},
  bluffer:   {ch:.26,trust:1.20,bluff:.82},
  aggressive:{ch:.55,trust:.92,bluff:.55},
};
const aiThinkTime=p=>{
  const r={cautious:[1.6,2.8],bluffer:[1.1,2.2],aggressive:[.5,1.3]}[p.persona]||[1,2];
  return rnd(r[0],r[1])*[1.25,1,.8][G.diff]*1000;
};
const HONEST_CNT={cautious:3,bluffer:1,aggressive:2};
function bluffIdx(p,cnt){
  const idx=p.hand.map((c,i)=>matches(c,G.called)?-1:i).filter(i=>i>=0);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
    const tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}
  return idx.slice(0,Math.min(cnt,idx.length));
}
function aiDecide(p){
  const honest=p.hand.map((c,i)=>matches(c,G.called)?i:-1).filter(i=>i>=0);
  const last=G.claims[G.claims.length-1];
  if(!last){
    if(honest.length)return{a:'play',i:honest.slice(0,HONEST_CNT[p.persona])};
    const cnt={cautious:1,bluffer:2,aggressive:ri(1,2)}[p.persona];
    return{a:'play',i:bluffIdx(p,cnt)};
  }
  const own=p.hand.filter(c=>matches(c,G.called)).length;
  const base=Math.max(1,8-own)/15;
  let pt=Math.pow(1-Math.pow(1-base,5),last.n);
  pt*=Math.pow(.86,G.claims.length-1)*AI_CFG[p.persona].trust;
  if(G.diff===0)pt+=rnd(-.15,.15);
  pt=clamp(pt,.02,.98);
  if(pt<AI_CFG[p.persona].ch)return{a:'challenge'};
  if(honest.length)return{a:'play',i:honest.slice(0,HONEST_CNT[p.persona])};
  let bf=AI_CFG[p.persona].bluff*(G.claims.length>=3?.55:1)*(G.diff===2?1.15:1);
  if(Math.random()<Math.min(bf,.95)){
    const cnt={cautious:1,bluffer:2,aggressive:ri(1,2)}[p.persona];
    return{a:'play',i:bluffIdx(p,cnt)};
  }
  return{a:'challenge'};
}

async function beginTurn(idx){
  if(G.mode==='menu')return;
  const p=G.players[idx];G.cur=idx;sync();
  if(!p.hand.length&&G.claims.length){
    logH('logForced',p);sync();
    await sleep(700);if(G.mode==='menu')return;
    return doChallenge(idx);
  }
  if(p.ctl==='ai'){
    await sleep(aiThinkTime(p));
    if(G.mode==='menu'||G.cur!==idx)return;
    const d=aiDecide(p);
    if(d.a==='challenge')return doChallenge(idx);
    return playCards(idx,d.i);
  }
  const act=await requestAction(idx);
  if(G.mode==='menu')return;
  if(act.type==='challenge'){
    if(G.claims.length)return doChallenge(idx);
    return playCards(idx,[0]);
  }
  let idxs=(act.indices||[]).filter(v=>Number.isInteger(v)&&v>=0&&v<p.hand.length);
  idxs=[...new Set(idxs)].slice(0,3);
  if(!idxs.length)idxs=[0];
  return playCards(idx,idxs);
}
function requestAction(seat){
  return new Promise(res=>{

      $('hint').style.display='block';$('hint').textContent=t('hint');

    sync();

}
function resolveAct(act){

async function playCards(idx,indices){

  indices=[...indices].sort((a,b)=>b-a);
  const cards=indices.map(i=>p.hand.splice(i,1)[0]);
  G.claims.push({p:idx,n:cards.length,cards:cards});
  sfx('card');log('logPlayed',p,cards.length);

async function doChallenge(ch){
  if(G.mode==='menu'||!G.claims.length)return;
  const grp=G.claims[G.claims.length-1];
  const truth=grp.cards.every(c=>matches(c,G.called));
  G.hl=[ch,grp.p];G.cur=-1;
  logH('logChallenge',G.players[ch]);sfx('knock');sync();
  await sleep(900);if(G.mode==='menu')return;
  G.reveal={p:grp.p,cards:grp.cards,truth:truth,at:performance.now()};
  facesFromReveal(G.hl,G.reveal);
  sfx('slide');sync();
  await sleep(1100);if(G.mode==='menu')return;
  const loser=truth?ch:grp.p;
  logH(truth?'logTruth':'logLie',truth?G.players[ch]:G.players[grp.p]);
  await fxLifeLostSeq(loser);if(G.mode==='menu')return;
  const L=G.players[loser];L.lives--;sync();
  if(L.lives<=0){
    L.out=true;sfx('glass');logH('logOut',L);
    if(loser===G.mySeat)renderHand();
  }
  const alive=G.players.filter(p=>!p.out);
  if(alive.length<=1)return gameOver(alive[0]?alive[0].id:0);

function hostCreate(){
  initAudio();
  if(typeof Peer==='undefined'){netStatus('⚠ '+t('mpNoLib'));return;}
  if(G.peer){try{G.peer.destroy();}catch(e){} G.peer=null;}
  netStatus('… '+t('mpConnecting'));
  $('mpCreate').disabled=true;
  let settled=false;
  const fail=msg=>{
    if(settled)return;settled=true;
    try{if(G.peer)G.peer.destroy();}catch(e){}
    G.peer=null;G.conns=[];G.hosting=false;
    netStatus('✕ '+msg);$('mpCreate').disabled=false;};
  const code=genCode();
  try{G.peer=new Peer('lbx-'+code,PEER_OPTS);}
  catch(e){fail(t('mpFail'));return;}
  const timeout=setTimeout(()=>fail(t('mpFail')),12000);
  G.peer.on('open',()=>{
    if(settled)return;settled=true;clearTimeout(timeout);
    G.conns=[];G.hosting=true;G.code=code;G.netSeats=[true,false,false,false];
    $('mpCode').textContent=code;
    showOv('lobby');renderLobby();$('mpCreate').disabled=false;
  });
  G.peer.on('error',e=>{
    clearTimeout(timeout);
    if(e&&e.type==='unavailable-id'){hostCreate();return;}
    fail(t('mpFail')+(e&&e.type?' ('+e.type+')':''));
  });
  G.peer.on('disconnected',()=>{try{if(G.peer)G.peer.reconnect();}catch(e){}});
  G.peer.on('connection',conn=>{
    conn.on('open',()=>{
      if(G.mode==='host'){
        try{conn.send({t:'full'});}catch(e){}
        setTimeout(()=>{try{conn.close();}catch(e){}},400);return;
      }
      const seat=G.netSeats.findIndex(o=>!o);
      if(seat<0){
        try{conn.send({t:'full'});}catch(e){}
        setTimeout(()=>{try{conn.close();}catch(e){}},400);return;
      }
      G.netSeats[seat]=true;conn._seat=seat;
      G.conns.push(conn);
      try{conn.send({t:'welcome',seat:seat});}catch(e){}
      renderLobby();
    });
    conn.on('data',d=>hostData(conn,d));
    conn.on('close',()=>hostDrop(conn));
    conn.on('error',()=>hostDrop(conn));
  });
}
function hostData(conn,d){
  if(!d)return;
  if(d.t==='act'&&G.pendingSeat===conn._seat&&G.pendingResolve)resolveAct(d.act);
}
function hostDrop(conn){
  const i=G.conns.indexOf(conn);if(i>=0)G.conns.splice(i,1);
  if(conn._seat!=null)G.netSeats[conn._seat]=false;
  if(G.mode==='host'&&G.players.length&&conn._seat!=null){
    const p=G.players[conn._seat];
    if(p&&!p.out){
      p.ctl='ai';if(!p.persona)p.persona='bluffer';
      if(G.pendingSeat===conn._seat){
        resolveAct(p.hand.length?{type:'play',indices:[0]}:{type:'challenge'});
      }
    }
  }
  renderLobby();
}
function renderLobby(){
  let html='<b>'+t('mpPlayers')+'</b><br>';
  for(let i=0;i<4;i++){
    const c=G.conns.find(x=>x._seat===i);

    else if(c)nm=t('p'+(i+1));
    else nm='<span style="color:#7a6a4a">'+t('mpSlotEmpty')+'</span>';
    html+=(i===0?'<span class="you">':'')+' '+(i+1)+'. '+nm+(i===0?'</span>':'')+'<br>';
  }

function hostStart(){
  const players=[mk(0,'you','local')];
  for(let i=1;i<4;i++){
    const c=G.conns.find(x=>x._seat===i);
    if(c)players.push(mk(i,'p'+(i+1),'net'));
    else players.push(mk(i,['max','vic','scarlett'][i-1],'ai',['cautious','bluffer','aggressive'][i-1]));
  }

function clientJoin(code){
  initAudio();
  if(typeof Peer==='undefined'){netStatus('⚠ '+t('mpNoLib'));return;}
  if(G.peer){try{G.peer.destroy();}catch(e){} G.peer=null;}
  netStatus('… '+t('mpConnecting'));
  let settled=false;
  const fail=msg=>{
    if(settled)return;settled=true;
    try{if(G.peer)G.peer.destroy();}catch(e){}
    G.peer=null;G.conn=null;
    netStatus('✕ '+msg);};
  try{G.peer=new Peer(PEER_OPTS);}
  catch(e){fail(t('mpFail'));return;}
  const timeout=setTimeout(()=>fail(t('mpFail')),12000);
  G.peer.on('error',e=>{
    if(settled)return;
    if(e&&e.type==='peer-unavailable'){
      clearTimeout(timeout);settled=true;
      try{G.peer.destroy();}catch(err2){G.peer=null;}
      G.peer=null;
      netStatus('✕ '+t('mpBadCode'));return;
    }
    clearTimeout(timeout);fail(t('mpFail'));
  });
  G.peer.on('open',()=>{
    if(settled)return;
    const conn=G.peer.connect('lbx-'+code,{reliable:true});
    G.conn=conn;
    conn.on('open',()=>{settled=true;clearTimeout(timeout);
      try{conn.send({t:'hello'});}catch(e){}});
    conn.on('data',d=>clientData(d));
    conn.on('close',()=>{if(G.mode!=='menu')clientDrop();});
    conn.on('error',()=>{clearTimeout(timeout);fail(t('mpFail'));});
  });
}
function clientData(d){
  if(!d)return;
  if(d.t==='welcome'){
    G.netSeat=d.seat;
    showOv('waiting');
    $('wtTitle').textContent=t('mpWait');$('wtText').textContent=t('mpWaitT');
  }
  else if(d.t==='start'){
    G.mode='client';G.mySeat=G.netSeat;G.overShown=false;
    hideAll();G.players=[];G.log=[];renderLog();G.over=null;G._overT=null;
  }
  else if(d.t==='state')safe(applyState,d.s);
  else if(d.t==='dialogue')showDialogueLocal(d.lines);
  else if(d.t==='finale'){
    if(G._overT){clearTimeout(G._overT);G._overT=null;}
    showDialogueLocal(d.win?STORY.win:STORY.lose).then(()=>showOver(d.win));
  }
  else if(d.t==='lobby'){
    G.overShown=false;G._overT=null;G.players=[];G.claims=[];G.reveal=null;G.over=null;
    renderHand();renderRoundInfo();
    hideAll();showOv('waiting');
    $('wtTitle').textContent=t('mpWait');$('wtText').textContent=t('mpWaitT');
  }
  else if(d.t==='full')netStatus('✕ '+t('mpFull'));
}
function clientDrop(){

function applyState(s){
  const prev=G.players.map(p=>p.lives);
  G.mySeat=s.mySeat;G.round=s.round;G.called=s.called;G.cur=s.cur;G.hl=s.hl;
  G.players=s.players.map((pl,i)=>({id:i,key:i===s.mySeat?'you':pl.key,lives:pl.lives,out:pl.out,
    hand:i===s.mySeat?s.hand.slice():new Array(pl.hc||0).fill(0),ctl:'remote'}));
  G.claims=s.claims;
  if(s.reveal){
    const isNew=!G.reveal||G.reveal.p!==s.reveal.p||G.reveal.cards.join()!==s.reveal.cards.join();
    if(isNew){G.reveal={p:s.reveal.p,cards:s.reveal.cards,truth:s.reveal.truth,at:performance.now()};
      facesFromReveal(s.hl,s.reveal);}

  }else G.reveal=null;
  G.gun.target=s.gun.t;G.gun.kick=Math.max(G.gun.kick,s.gun.k);
  G.log=s.log;G.over=s.over;

const wstars=[{x:.18,y:.2},{x:.4,y:.12},{x:.62,y:.25},{x:.85,y:.18},{x:.3,y:.35},{x:.75,y:.4}];
const wrain=Array.from({length:26},()=>({x:Math.random(),y:Math.random(),s:rnd(.8,1.6)}));
function cloudLayer(off,x,yy,w,hh,col){
  ctx.fillStyle=col;
  const base=((off%1)+1)%1;
  for(let k=0;k<3;k++){
    const cx=x+((base+k*.38)%1)*w;
    ctx.beginPath();
    ctx.ellipse(cx,yy+Math.sin(k*3)*3,hh*.5,hh*.28,0,0,7);
    ctx.ellipse(cx+hh*.4,yy+2,hh*.34,hh*.2,0,0,7);
    ctx.ellipse(cx-hh*.4,yy+3,hh*.3,hh*.18,0,0,7);
    ctx.fill();
  }
}
function drawWindow(t,dt){
  const x=WIN.x,y=WIN.y,w=WIN.w,h=WIN.h;
  const f=clamp(G.flash,0,1);
  sc(ctx,()=>{
    ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    const sky=ctx.createLinearGradient(0,y,0,y+h);
    sky.addColorStop(0,`rgb(${20+f*130|0},${26+f*130|0},${38+f*140|0})`);
    sky.addColorStop(.7,`rgb(${38+f*140|0},${42+f*140|0},${52+f*150|0})`);
    sky.addColorStop(1,`rgb(${30+f*130|0},${28+f*120|0},${34+f*130|0})`);
    ctx.fillStyle=sky;ctx.fillRect(x,y,w,h);
    for(let i=0;i<wstars.length;i++){
      const s=wstars[i];
      const a=(.25+Math.sin(t*2+s.x*9)*.2)*(1-f*.8);
      if(a>0){
        ctx.fillStyle=`rgba(220,230,255,${a.toFixed(2)})`;
        ctx.fillRect(x+s.x*w,y+s.y*h,1,1);
      }
    }
    ctx.fillStyle=`rgba(215,225,245,${(.75-f*.4).toFixed(2)})`;
    ctx.beginPath();ctx.arc(x+w*.72,y+h*.22,7,0,7);ctx.fill();
    ctx.fillStyle='rgba(160,175,205,.35)';
    ctx.beginPath();ctx.arc(x+w*.72-2,y+h*.22-1.5,1.6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*.72+2.5,y+h*.22+2,1.1,0,7);ctx.fill();
    cloudLayer(t*.175,x,y+8,w,22,'rgba(16,20,30,.55)');
    cloudLayer(-t*.11+50,x,y+24,w,18,'rgba(24,28,40,.7)');

      ctx.strokeStyle=`rgba(255,250,220,${((f-.55)*2).toFixed(2)})`;
      ctx.lineWidth=1.8;ctx.beginPath();

    }
    const gy=y+h-14;
    const dk=`rgb(${14+f*110|0},${15+f*110|0},${20+f*120|0})`;
    ctx.fillStyle=dk;

    for(let i=0;i<bld.length;i++){
      ctx.fillRect(x+bld[i][0]*w,gy-bld[i][2],bld[i][1],bld[i][2]);
      ctx.beginPath();ctx.moveTo(x+bld[i][0]*w-2,gy-bld[i][2]);
      ctx.lineTo(x+bld[i][0]*w+bld[i][1]/2,gy-bld[i][2]-4);
      ctx.lineTo(x+bld[i][0]*w+bld[i][1]+2,gy-bld[i][2]);ctx.fill();
    }
    ctx.fillRect(x+w*.36,gy-40,7,40);
    ctx.beginPath();ctx.moveTo(x+w*.36-2,gy-40);ctx.lineTo(x+w*.36+3.5,gy-48);
    ctx.lineTo(x+w*.36+9,gy-40);ctx.fill();
    const tx=x+w*.9;
    ctx.strokeStyle=dk;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(tx-4,gy);ctx.lineTo(tx-2,gy-16);ctx.moveTo(tx+4,gy);ctx.lineTo(tx+2,gy-16);ctx.stroke();
    fe(ctx,tx,gy-19,7,5,dk);
    ctx.fillStyle=dk;ctx.fillRect(tx-6,gy-17,12,2);
    const wx=x+w*.16,wy=gy-2;
    ctx.strokeStyle=dk;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(wx-3,wy);ctx.lineTo(wx,wy-20);ctx.lineTo(wx+3,wy);ctx.stroke();
    sc(ctx,()=>{
      ctx.translate(wx,wy-21);ctx.rotate(t*1.4);

    ctx.strokeStyle=`rgb(${22+f*110|0},${20+f*100|0},${16+f*90|0})`;ctx.lineWidth=1;
    sc(ctx,()=>{

    });

    ctx.fillRect(x,gy,w,14);
    ctx.fillStyle=`rgb(${26+f*110|0},${22+f*100|0},${18+f*100|0})`;
    for(let k=0;k<4;k++)ctx.fillRect(x+8+k*12,gy-4,2,4);
    ctx.strokeStyle=`rgba(185,200,230,${(.34+f*.4).toFixed(2)})`;ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<wrain.length;i++){
      const d=wrain[i];
      d.y+=d.s*dt*2.2;
      if(d.y>1.1){d.y=-.1;d.x=Math.random();}
      const px=x+d.x*w,py=y+d.y*h;
      ctx.moveTo(px,py);ctx.lineTo(px-2.2,py+7);
    }
    ctx.stroke();
    const litW=[[.05,-18],[.29,-20],[.31,-10],[.57,-14],[.73,-18],[.75,-8]];
    for(let k=0;k<litW.length;k++){
      const a=(.55+Math.sin(t*3+k*2.1)*.2)*(k%3===0?.5:1);
      ctx.fillStyle=`rgba(240,185,95,${clamp(a,.1,.9).toFixed(2)})`;
      ctx.fillRect(x+litW[k][0]*w,gy+litW[k][1],3,3.5);
    }
  });
  ctx.strokeStyle='#4a381c';ctx.lineWidth=4;ctx.strokeRect(x-2,y-2,w+4,h+4);
  ctx.strokeStyle='#2e2210';ctx.lineWidth=1.5;ctx.strokeRect(x-4,y-4,w+8,h+8);
  ctx.fillStyle='#4a381c';ctx.fillRect(x+w/2-2,y,4,h);ctx.fillRect(x,y+h/2-2,w,4);
  ctx.fillStyle='#54381c';ctx.fillRect(x-8,y+h,w+16,5);
  ctx.fillStyle='rgba(255,220,150,.12)';ctx.fillRect(x-8,y+h,w+16,1.5);
  ctx.fillStyle=`rgba(150,175,215,${(.05+f*.3).toFixed(3)})`;
  ctx.beginPath();ctx.moveTo(x+4,y+h+4);ctx.lineTo(x+w-4,y+h+4);
  ctx.lineTo(x+w+40,y+h+96);ctx.lineTo(x-40,y+h+96);ctx.closePath();ctx.fill();
}

  ctx.beginPath();ctx.moveTo(54.5,193);ctx.quadraticCurveTo(53.5,189,57,185.5-f*1.5);

  ctx.fillStyle='rgba(255,246,200,.95)';
  ctx.beginPath();ctx.ellipse(57,190.5,1.2,1.9,0,0,7);ctx.fill();
  sc(ctx,()=>{
    ctx.globalCompositeOperation='lighter';
    const g2=ctx.createRadialGradient(57,189,2,57,192,34);
    g2.addColorStop(0,`rgba(255,180,90,${(.22*f).toFixed(2)})`);
    g2.addColorStop(1,'rgba(255,180,90,0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(57,192,34,0,7);ctx.fill();
  });
  zzzT+=.008;
  ctx.font='700 8px Oswald,sans-serif';
  for(let k=0;k<3;k++){
    const ph=(zzzT+k*.33)%1;
    ctx.fillStyle=`rgba(200,215,235,${(Math.sin(ph*Math.PI)*.55).toFixed(2)})`;
    ctx.fillText('z',122-ph*8,282-ph*16-k*2);
  }
}
const DECOR_ANIM=[barAnim,stageAnim,tablesAnim];
function drawDecorAnim(t){
  for(let side=-1;side<=1;side+=2){
    const d=side<0?G.decorL:G.decorR;
    safe(withSide,ctx,side,()=>{DECOR_ANIM[d](t);});
  }
}

/* ---------- HP-карты ---------- */
function lifeCards(g,cx,cy,lives,s){
  const w2=9*s,h2=13*s,gap=3.5*s;
  for(let l=0;l<3;l++){
    const x=cx+l*(w2+gap),y=cy;
    g.fillStyle=l<lives?'#ded5b2':'#453f36';
    g.fillRect(x,y,w2,h2);
    g.strokeStyle=l<lives?'#23201a':'#2b2721';g.lineWidth=1;
    g.strokeRect(x+.5,y+.5,w2-1,h2-1);
    if(l<lives){
      sc(g,()=>{
        g.translate(x+w2/2,y+h2*.62);g.scale(s,s);
        heart(g,0,0,2.8,'#c2402f');
      });
    }else{
      g.strokeStyle='rgba(205,60,45,.85)';g.lineWidth=1.6*s;g.lineCap='round';
      g.beginPath();
      g.moveTo(x+2,y+2);g.lineTo(x+w2-2,y+h2-2);
      g.moveTo(x+w2-2,y+2);g.lineTo(x+2,y+h2-2);
      g.stroke();
      g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,y,w2,h2);
    }
  }
}
function drawPlaques(t){
  if(!G.players.length)return;
  for(let i=1;i<4;i++){
    const p=G.players[i],P=PLAQ[i];
    if(!P)continue;
    const w=112,h=30,x=P.x-w/2,y=P.y-h/2;
    const act=G.cur===i||(G.hl&&G.hl.indexOf(i)>=0);
    ctx.fillStyle='rgba(16,10,5,.88)';
    ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();
    ctx.lineWidth=act?2:1;
    ctx.strokeStyle=act?(G.cur===i?'#e8b64c':'#c07f3a'):'#6e5233';
    ctx.stroke();
    ctx.font='600 11px Oswald,sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillStyle=p.out?'#6a5c46':'#e6d7b0';
    ctx.fillText(t(p.key),x+7,y+12);
    const think=G.cur===i&&!p.out&&i!==G.mySeat&&(p.ctl==='ai'||G.mode==='client');
    if(think){
      const dots=1+Math.floor(t*3)%3;
      ctx.fillStyle='#e8b64c';
      const nw=ctx.measureText(t(p.key)).width;
      for(let d=0;d<dots;d++)ctx.fillRect(x+11+nw+d*5,y+5,3,3);
    }
    lifeCards(ctx,x+w-36,y+4,p.lives,.85);
    const hc=Math.min(p.hand.length,5);
    for(let c2=0;c2<hc;c2++){
      ctx.fillStyle='#4a1d26';ctx.fillRect(x+7+c2*6.5,y+18,4.5,8);
      ctx.strokeStyle='#6b2c33';ctx.lineWidth=1;
      ctx.strokeRect(x+7.5+c2*6.5,y+18.5,3.5,7);
    }
  }
}
function drawPlayerHP(){
  if(!G.players.length)return;
  const me=G.players[G.mySeat];if(!me)return;
  ctx.font='600 8px Oswald,sans-serif';ctx.fillStyle='#cbb98a';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText(t('yourLives'),12,294);
  lifeCards(ctx,12,298,me.lives,1.5);
}
function drawArrows(t){
  if(G.cur<0||G.reveal)return;
  const A2=ARROWS[G.cur],pl=1+Math.sin(t*6)*.22;
  sc(ctx,()=>{
    ctx.translate(A2.x,A2.y);ctx.rotate(A2.r);ctx.scale(pl,pl);
    ctx.fillStyle='#e8b64c';ctx.strokeStyle='#5c3d10';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(6.5,3);ctx.lineTo(0,0);ctx.lineTo(-6.5,3);ctx.closePath();
    ctx.fill();ctx.stroke();
  });
}
function drawHitFx(){
  if(!G.hitFx)return;
  const el=(performance.now()-G.hitFx.at)/500;
  if(el<1){
    const hd=HEAD[G.hitFx.seat];
    sc(ctx,()=>{
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=`rgba(255,90,50,${((1-el)*.8).toFixed(2)})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(hd.x,hd.y,6+el*22,0,7);ctx.stroke();
      ctx.fillStyle=`rgba(255,60,40,${((1-el)*.35).toFixed(2)})`;
      ctx.beginPath();ctx.arc(hd.x,hd.y,12,0,7);ctx.fill();
    });
  }else G.hitFx=null;
}

/* ---------- ГЛАВНЫЙ КАДР: слои изолированы, камера всегда на месте ---------- */
function draw(t,dt){
  ctx.drawImage(bg,0,0);
  safe(drawWindow,t,dt);
  safe(drawSconces,t);
  for(let i=0;i<4;i++)safe(drawBust,i,t);
  ctx.drawImage(tb,0,0);        /* стол поверх дальних персонажей */
  safe(drawFanLight);
  safe(drawGun);
  safe(drawClaims);
  safe(drawReveal);
  for(let i=0;i<4;i++)safe(drawArms,i,t);
  safe(drawDecorAnim,t);
  safe(drawPlaques,t);
  safe(drawPlayerHP);
  safe(drawArrows,t);
  safe(drawHitFx);
  safe(drawSmoke,dt);
  safe(drawFanUnit,t);          /* вентилятор с лампой — ПОСЛЕДНИЙ: ничего его не закроет */
  if(G.flashRed>0){
    ctx.fillStyle=`rgba(255,60,30,${(G.flashRed*.26).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    G.flashRed*=Math.pow(.01,dt);if(G.flashRed<.01)G.flashRed=0;
  }
  if(G.flash>0){
    ctx.fillStyle=`rgba(190,205,235,${(G.flash*.2).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    G.flash*=Math.pow(.015,dt);if(G.flash<.01)G.flash=0;
  }
}
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  G.fanAng+=dt*2.4;
  G.gun.ang=angLerp(G.gun.ang,G.gun.target,Math.min(1,dt*7));
  G.gun.kick=Math.max(0,G.gun.kick-dt*2.4);
  dlgTick(dt);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  safe(draw,now/1000,dt);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(!$('custom').classList.contains('hidden'))safe(renderPreview,now/1000);
}
requestAnimationFrame(loop);

/* ==================== UI ==================== */
function renderHand(anim){
  const h=$('hand');h.innerHTML='';
  const p=G.players[G.mySeat];if(!p||p.out)return;
  for(let i=0;i<p.hand.length;i++){
    const c=p.hand[i];
    const d=document.createElement('div');
    let cls='card '+(c===JKR?'joker ':'')+(G.uiTurn?'on':'off');
    if(G.sel.has(i))cls+=' sel';
    d.className=cls;
    if(anim){d.classList.add('deal');d.style.animationDelay=(i*60)+'ms';}
    d.innerHTML='<span class="s">'+LETTER[c]+'</span><span class="b">'+LETTER[c]+
      '</span><span class="c">'+LETTER[c]+'</span>';
    d.onclick=()=>{
      if(!G.uiTurn)return;
      sfx('click');
      if(G.sel.has(i))G.sel.delete(i);
      else if(G.sel.size<3)G.sel.add(i);
      renderHand();updateButtons();
    };
    h.appendChild(d);
  }
}
function updateButtons(){
  const bp=$('btnPlay'),bc=$('btnChallenge');
  bp.disabled=!G.uiTurn||!G.sel.size;
  bp.textContent=t('put')+(G.sel.size?(' ('+G.sel.size+')'):'');
  bc.disabled=!G.uiTurn||!G.claims.length;
}
function doAction(act){
  if(G.mode==='client'){
    if(G.uiTurn&&G.conn&&G.conn.open){
      G.conn.send({t:'act',act:act});
      G.uiTurn=false;G.sel.clear();
      $('hint').style.display='none';
      renderHand();updateButtons();
    }
    return;
  }
  if(G.uiTurn&&G.pendingSeat===G.mySeat&&G.pendingResolve)resolveAct(act);
}
function renderRoundInfo(){
  $('roundLbl').textContent=G.round>0?tf('round',G.round):'';
  $('calledLbl').textContent=t('calledLbl')+' '+t(CARD_KEY[G.called]);
  const cc=$('calledCv').getContext('2d');
  cc.setTransform(1,0,0,1,0,0);
  cc.clearRect(0,0,26,36);
  cc.save();
  cc.translate(13,18);cc.scale(.72,.72);
  cc.fillStyle=G.called===JKR?'#262630':'#ded5b2';cc.fillRect(-9,-14,18,28);
  cc.strokeStyle=G.called===JKR?'#f2cc4e':'#23201a';cc.lineWidth=1;cc.strokeRect(-8.5,-13.5,17,27);
  cc.fillStyle=G.called===JKR?'#f2cc4e':'#23201a';
  cc.font='700 14px Rubik,monospace';cc.textAlign='center';cc.textBaseline='middle';
  cc.fillText(LETTER[G.called],0,1);
  cc.restore();
}

/* ---------- диалоги ---------- */
let dlg=null;
const elDlg=$('dialogue'),elDlgName=$('dlgName'),elDlgText=$('dlgText');
function showDialogue(lines){
  if(G.mode==='host')broadcast({t:'dialogue',lines:lines});
  return showDialogueLocal(lines);
}
function showDialogueLocal(lines){
  return new Promise(res=>{
    dlg={lines:lines,i:-1,chars:0,typing:false,
      done:()=>{dlg=null;elDlg.classList.remove('show');res();}};
    elDlg.classList.add('show');dlgNext();
  });
}
function dlgNext(){
  dlg.i++;
  if(dlg.i>=dlg.lines.length){dlg.done();return;}
  const L=dlg.lines[dlg.i];
  elDlgName.textContent=t(L.w);elDlgText.textContent='';
  dlg.chars=0;dlg.typing=true;
}
function dlgTick(dt){
  if(!dlg||!dlg.typing)return;
  dlg.chars+=dt*45;
  const full=dlg.lines[dlg.i][G.lang],n=Math.floor(dlg.chars);
  elDlgText.textContent=full.slice(0,n);
  if(n>=full.length)dlg.typing=false;
}
function dlgClick(){
  if(!dlg)return;
  if(dlg.typing){dlg.typing=false;elDlgText.textContent=dlg.lines[dlg.i][G.lang];}
  else dlgNext();
}
elDlg.addEventListener('mousedown',e=>{e.preventDefault();dlgClick();});

/* ==================== РЕДАКТОР ПЕРСОНАЖА ==================== */
const pvCv=$('pvCv'),pvCtx=pvCv.getContext('2d');
pvCtx.imageSmoothingEnabled=false;
function renderPreview(t){
  const c=pvCtx;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,120,150);
  const gr=c.createRadialGradient(60,70,10,60,80,95);
  gr.addColorStop(0,'#3a2c18');gr.addColorStop(1,'#171008');
  c.fillStyle=gr;c.fillRect(0,0,120,150);
  const C=getChar(0);
  sc(c,()=>{
    c.translate(60,104);c.scale(2.1,2.1);
    fe(c,0,21,17,6,'rgba(0,0,0,.35)');
    drawTorso(c,0,C);
    drawHead(c,0,C,t,false);
  });
}
function buildCustomRows(){
  const box=$('cOpts');box.innerHTML='';
  for(const pair of CUSTOM_KEYS){
    const k=pair[0],label=pair[1];
    const row=document.createElement('div');row.className='crow';
    const lab=document.createElement('span');lab.className='clab';lab.dataset.label=label;
    const bl=document.createElement('button');bl.className='cbtn';bl.textContent='◀';
    const val=document.createElement('span');val.className='cval';
    const br=document.createElement('button');br.className='cbtn';br.textContent='▶';
    bl.onclick=()=>cycleCustom(k,-1);
    br.onclick=()=>cycleCustom(k,1);
    row.appendChild(lab);row.appendChild(bl);row.appendChild(val);row.appendChild(br);
    box.appendChild(row);
  }
}
function rowValHTML(k){
  const v=OPTS[k][G.custom[k]];
  if(k==='hatStyle')return '<span>'+t('hat_'+v)+'</span>';
  if(k==='hairStyle')return '<span>'+t('hair_'+v)+'</span>';
  if(k==='acc')return '<span>'+t('acc_'+v)+'</span>';
  if(k==='vest')return v?'<span class="chip" style="background:'+v+'"></span>':'<span>'+t('vest_none')+'</span>';
  return '<span class="chip" style="background:'+v+'"></span>';
}
function updateCustomUI(){
  const rows=$('cOpts').children;
  for(let i=0;i<rows.length&&i<CUSTOM_KEYS.length;i++)
    rows[i].querySelector('.cval').innerHTML=rowValHTML(CUSTOM_KEYS[i][0]);
}
function updateCustomTexts(){
  const rows=$('cOpts').children;
  for(let i=0;i<rows.length&&i<CUSTOM_KEYS.length;i++)
    rows[i].querySelector('.clab').textContent=t(CUSTOM_KEYS[i][1]);
}
function cycleCustom(k,d){
  G.custom[k]=(G.custom[k]+d+OPTS[k].length)%OPTS[k].length;
  saveCustom();rebuildCharCache();updateCustomUI();sfx('click');
}

/* ---------- меню и оверлеи ---------- */
function showOv(id){
  const ids=['menu','mp','lobby','waiting','gameover','custom'];
  for(let i=0;i<ids.length;i++)$(ids[i]).classList.toggle('hidden',ids[i]!==id);
}
function hideAll(){
  const ids=['menu','mp','lobby','waiting','gameover','custom'];
  for(let i=0;i<ids.length;i++)$(ids[i]).classList.add('hidden');
}
function refreshMenuTexts(){
  $('mTitle').innerHTML=t('title').replace(' ','<br>');
  $('mSub').textContent=t('sub');
  $('mBots').textContent='⟩ '+t('bots');
  $('mNet').textContent='⟩ '+t('net');
  $('mChar').textContent='⟩ '+t('charBtn');
  $('mDiff').textContent='⟩ '+t('diffTitle')+': '+t(['easy','normal','hard'][G.diff]);
  $('mLang').textContent='⟩ '+t('langTitle')+': '+(G.lang==='ru'?'Русский':'English');
  $('mSound').textContent='⟩ '+t('soundTitle')+': '+t(G.muted?'off':'on');
  $('mRules').innerHTML=t('rules1')+'<br>'+t('rules2');
  $('mpTitle').textContent=t('mpTitle');
  $('mpCreate').textContent=t('mpCreate');
  $('mpJoin').textContent=t('mpJoin');
  $('mpBack').textContent=t('mpBack');
  $('mpInput').placeholder=t('mpCode');
  $('lbTitle').textContent=t('mpTitle');
  $('lbStart').textContent=t('mpStart');
  $('lbBack').textContent=t('mpBack');
  $('btnCopy').textContent=t('mpCopy');
  $('wtExit').textContent=t('mpExit');
  $('goAgain').textContent=t('again');
  $('goMenu').textContent=t('toMenu');
  $('btnPlay').textContent=t('put');
  $('btnChallenge').textContent=t('challenge');
  $('cTitle').textContent=t('charTitle');
  $('cRandom').textContent=t('charRandom');
  $('cBack').textContent=t('charDone');
  updateCustomTexts();updateCustomUI();
  if(G.players.length)renderRoundInfo();
  updateButtons();
}
function setLang(l){G.lang=l;safe(buildBg);refreshMenuTexts();renderLog();}

/* ---------- обработчики ---------- */
 $('mBots').onclick=()=>{
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  sfx('click');netDown();G.hosting=false;
  rollDecor();safe(buildBg);
  G.players=[mk(0,'you','local'),mk(1,'max','ai','cautious'),
             mk(2,'vic','ai','bluffer'),mk(3,'scarlett','ai','aggressive')];
  startMatch();
};
 $('mNet').onclick=()=>{initAudio();sfx('click');showOv('mp');netStatus('');};
 $('mChar').onclick=()=>{initAudio();sfx('click');showOv('custom');};
 $('cBack').onclick=()=>{sfx('click');showOv('menu');};
 $('cRandom').onclick=()=>{
  sfx('click');
  for(const k of Object.keys(G.custom))G.custom[k]=ri(0,OPTS[k].length-1);
  saveCustom();rebuildCharCache();updateCustomUI();
};
 $('mDiff').onclick=()=>{G.diff=(G.diff+1)%3;sfx('click');refreshMenuTexts();};
 $('mLang').onclick=()=>{setLang(G.lang==='ru'?'en':'ru');sfx('click');};
 $('mSound').onclick=()=>{initAudio();toggleMute();};
 $('mpCreate').onclick=()=>{sfx('click');hostCreate();};
 $('mpJoin').onclick=()=>{
  const code=$('mpInput').value.trim().toUpperCase();
  if(code.length<4){netStatus('✕ '+t('mpBadCode'));return;}
  sfx('click');clientJoin(code);
};
 $('mpInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();$('mpJoin').click();}});
 $('mpBack').onclick=()=>{sfx('click');netDown();showOv('menu');};
 $('btnCopy').onclick=()=>{
  sfx('click');
  if(navigator.clipboard)navigator.clipboard.writeText(G.code).catch(()=>{});
  $('netStatus2').textContent='✓ '+t('mpCopied');
};
 $('lbStart').onclick=()=>{sfx('click');hostStart();};
 $('lbBack').onclick=()=>{sfx('click');G.mode='menu';netDown();G.players=[];showOv('menu');};
 $('wtExit').onclick=()=>{sfx('click');exitToMenu();};
 $('goAgain').onclick=()=>{
  sfx('click');
  if(G.mode==='client'){exitToMenu();return;}
  $('gameover').classList.add('hidden');
  if(G.hosting){
    G.mode='menu';G.players=[];G.claims=[];G.reveal=null;G.over=null;G.overShown=false;
    broadcast({t:'lobby'});
    showOv('lobby');renderLobby();
  }else{
    rollDecor();safe(buildBg);
    G.players=[mk(0,'you','local'),mk(1,'max','ai','cautious'),
               mk(2,'vic','ai','bluffer'),mk(3,'scarlett','ai','aggressive')];
    startMatch();
  }
};
 $('goMenu').onclick=()=>{sfx('click');exitToMenu();};
 $('btnPlay').onclick=()=>{
  if(G.uiTurn&&G.sel.size){sfx('click');doAction({type:'play',indices:[...G.sel]});}};
 $('btnChallenge').onclick=()=>{
  if(G.uiTurn&&G.claims.length){sfx('knock');doAction({type:'challenge'});}};
 $('btnLang').onclick=()=>setLang(G.lang==='ru'?'en':'ru');
 $('btnMute').onclick=()=>{initAudio();toggleMute();};
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if(dlg){e.preventDefault();dlgClick();return;}
    if(e.code==='Enter'&&G.uiTurn&&G.sel.size){
      e.preventDefault();doAction({type:'play',indices:[...G.sel]});}
    return;
  }
  if(e.code==='KeyQ'&&G.uiTurn&&G.claims.length){sfx('knock');doAction({type:'challenge'});}
  if(/^Digit[1-9]$/.test(e.code)&&G.uiTurn){
    const i=+e.code.slice(5)-1,p=G.players[G.mySeat];
    if(p&&i<p.hand.length){sfx('click');
      if(G.sel.has(i))G.sel.delete(i);
      else if(G.sel.size<3)G.sel.add(i);
      renderHand();updateButtons();}
  }
});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*.96;
  $('stage').style.transform='scale('+s+')';}
addEventListener('resize',fit);

/* ---------- старт ---------- */
loadCustom();
rebuildCharCache();
buildCustomRows();
refreshMenuTexts();fit();lightningLoop();
</script>
